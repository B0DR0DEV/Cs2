name: Tests and Android APK

# No accounts or secrets needed: Godot is MIT-licensed, the .NET SDK and Android SDK
# are preinstalled or downloaded anonymously, and the APK is signed with a debug key
# generated on the fly. Download the APK from the run's "StrikeZone-Android" artifact.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  tests:
    name: Core unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run tests
        run: >
          dotnet test tests/StrikeZone.Core.Tests/StrikeZone.Core.Tests.csproj
          --logger "trx;LogFileName=core.trx"
          --logger "console;verbosity=normal"
          --results-directory test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: test-results
          if-no-files-found: ignore

  android:
    name: Build Android APK
    needs: tests
    # Build even if a test failed so there is always an APK to try; the run still shows red.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Compile game code (fast C# error check)
        run: dotnet build StrikeZone.csproj -c ExportDebug

      - name: Install Godot (.NET) and export templates
        run: |
          set -euo pipefail
          V="${GODOT_VERSION}"
          BASE="https://github.com/godotengine/godot-builds/releases/download/${V}-stable"
          mkdir -p "$HOME/godot"
          cd "$HOME/godot"
          curl -fsSL -o godot.zip "$BASE/Godot_v${V}-stable_mono_linux_x86_64.zip"
          unzip -q godot.zip
          BIN="$(find "$HOME/godot" -maxdepth 2 -type f -name 'Godot_v*_mono_linux*x86_64' | head -n 1)"
          chmod +x "$BIN"
          echo "GODOT_BIN=$BIN" >> "$GITHUB_ENV"
          curl -fsSL -o templates.tpz "$BASE/Godot_v${V}-stable_mono_export_templates.tpz"
          DEST="$HOME/.local/share/godot/export_templates/${V}.stable.mono"
          mkdir -p "$DEST"
          unzip -q templates.tpz -d tpl
          mv tpl/templates/* "$DEST/"
          ls "$DEST"

      - name: Configure Android SDK path and debug keystore
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          keytool -genkeypair -keystore "$HOME/debug.keystore" -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p "$HOME/.config/godot"
          for NAME in editor_settings-4.tres editor_settings-4.7.tres; do
            cat > "$HOME/.config/godot/$NAME" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          done
          {
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/debug.keystore"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android"
          } >> "$GITHUB_ENV"
          ls "$SDK/build-tools" "$SDK/platform-tools" | head -20

      - name: Stamp version
        run: |
          sed -i "s/^version\/code=.*/version\/code=${{ github.run_number }}/" export_presets.cfg
          sed -i "s/^version\/name=.*/version\/name=\"0.2.${{ github.run_number }}\"/" export_presets.cfg

      - name: Import project
        run: |
          "$GODOT_BIN" --headless --import 2>&1 | tail -n 60 || true

      - name: Export APK
        run: |
          set -o pipefail
          mkdir -p build
          "$GODOT_BIN" --headless --export-debug "Android" build/StrikeZone.apk 2>&1 | tee export.log
          test -f build/StrikeZone.apk
          ls -la build

      - name: Upload export log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: export-log
          path: export.log
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StrikeZone-Android
          path: build/StrikeZone.apk
          if-no-files-found: error
          retention-days: 30
