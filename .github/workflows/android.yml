name: Tests and Android APK

# Every push to main (and every PR) runs the EditMode test suite, then builds a
# debug-signed APK with Unity in Docker (game-ci). The APK is attached to the run as
# the "StrikeZone-Android" artifact.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   UNITY_LICENSE   – contents of your Unity_lic.ulf (Personal licence is fine)
#   UNITY_EMAIL     – Unity account e-mail
#   UNITY_PASSWORD  – Unity account password
# Optional (release signing): ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASS,
#   ANDROID_KEYALIAS_NAME, ANDROID_KEYALIAS_PASS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_VERSION: 6000.3.27f1

jobs:
  tests:
    name: EditMode tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-tests-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}-${{ hashFiles('Assets/**/*.cs', 'Assets/**/*.asmdef') }}
          restore-keys: |
            Library-tests-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}-
            Library-tests-

      - name: Run EditMode tests
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: editmode
          artifactsPath: test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: test-results
          if-no-files-found: ignore

  android:
    name: Build Android APK
    needs: tests
    # Build even if a test failed, so there is always an APK to look at; the failed
    # test job still marks the run red.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free disk space (the Android editor image is large)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}-${{ hashFiles('Assets/**/*.cs', 'Assets/**/*.asmdef') }}
          restore-keys: |
            Library-Android-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}-
            Library-Android-

      - name: Build APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          buildName: StrikeZone
          buildMethod: StrikeZone.EditorTools.BuildScript.BuildAndroidCI
          androidExportType: androidPackage
          versioning: Custom
          version: 0.1.${{ github.run_number }}
          androidVersionCode: ${{ github.run_number }}
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}
          allowDirtyBuild: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StrikeZone-Android
          path: build/Android
          if-no-files-found: error
          retention-days: 30
